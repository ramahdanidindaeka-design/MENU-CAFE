<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Menu Kafe Interaktif</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header / Judul Kafe -->
  <header>
    <h1>☕ Kafe Kopi Kita</h1>
    <p>Pilih menu favoritmu & nikmati kemudahan pesan secara online!</p>
  </header>

  <main class="container">
    
    <!-- Tombol Filter Kategori -->
    <div class="category-filter">
      <button class="btn-filter active" onclick="filterMenu('semua')">Semua</button>
      <button class="btn-filter" onclick="filterMenu('Makanan')">🍔 Makanan</button>
      <button class="btn-filter" onclick="filterMenu('Minuman')">🥤 Minuman</button>
    </div>

    <!-- Container Daftar 100 Menu -->
    <section>
      <h2>Daftar Menu</h2>
      <div class="menu-list" id="menu-container">
        <!-- Kartu menu akan dirender secara otomatis oleh JavaScript -->
      </div>
    </section>

    <!-- Ringkasan Keranjang Pesanan -->
    <section class="cart-section">
      <h2>🛒 Keranjang Pesanan</h2>
      
      <ul id="cart-list" class="cart-list">
        <li class="empty-cart">Keranjang masih kosong</li>
      </ul>
      
      <!-- Input Kode Promo Diskon -->
      <div class="promo-section">
        <input type="text" id="promo-code" placeholder="Masukkan kode promo (misal: HEMAT10)">
        <button onclick="applyDiscount()">Gunakan</button>
      </div>
      <p id="promo-message" class="promo-msg"></p>

      <!-- Total Pembayaran -->
      <div class="cart-total">
        <h3>Total Pembayaran: <span id="total-price">Rp 0</span></h3>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
