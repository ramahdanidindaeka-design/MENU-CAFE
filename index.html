<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Digital - Kafe Kita</title>
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan font Google (Poppins) agar tampilan lebih modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. HEADER / NAVBAR -->
    <header class="header">
        <div class="logo-container">
            <h1 class="brand-title">☕ Kafe Kita</h1>
            <p class="brand-subtitle">Silakan pilih menu favoritmu!</p>
        </div>
    </header>

    <!-- 2. PENCARIAN DAN FILTER -->
    <section class="controls-section">
        <!-- Kolom Cari Menu -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari makanan atau minuman...">
        </div>

        <!-- Tombol Filter Kategori -->
        <div class="category-buttons">
            <button class="btn-filter active" data-category="semua">Semua</button>
            <button class="btn-filter" data-category="makanan">Makanan</button>
            <button class="btn-filter" data-category="minuman">Minuman</button>
            <button class="btn-filter" data-category="dessert">Dessert</button>
        </div>
    </section>

    <!-- 3. DAFTAR MENU (Akan diisi dinamis oleh JavaScript) -->
    <main class="menu-container">
        <div id="menuGrid" class="menu-grid">
            <!-- Kartu menu akan muncul di sini via script.js -->
        </div>
    </main>

    <!-- 4. RINGKASAN PESANAN (KERANJANG MELAYANG) -->
    <div id="cartBar" class="cart-bar hidden">
        <div class="cart-info">
            <span id="cartCount">0 Pesanan</span>
            <span id="cartTotal">Rp 0</span>
        </div>
        <button id="btnViewCart" class="btn-cart">Lihat Ringkasan</button>
    </div>

    <!-- 5. MODAL DETAIL PESANAN -->
    <div id="cartModal" class="modal hidden">
        <div class="modal-content">
            <span id="btnCloseModal" class="close-btn">&times;</span>
            <h2>Ringkasan Pesanan</h2>
            <div id="cartItemsList" class="cart-items-list">
                <!-- Daftar item yang dipilih akan muncul di sini -->
            </div>
            <hr>
            <div class="modal-summary">
                <p>Total Bayar: <strong id="modalTotal">Rp 0</strong></p>
            </div>
            <button id="btnOrderWA" class="btn-whatsapp">
                📱 Tunjukkan / Kirim Pesanan
            </button>
        </div>
    </div>

    <!-- Menghubungkan ke file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
